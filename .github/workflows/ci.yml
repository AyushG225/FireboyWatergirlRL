name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check firewater scripts tests
      - name: Check formatting
        run: ruff format --check firewater scripts tests
      - name: Compile Python sources
        run: python -m compileall -q firewater scripts tests
      - name: Run tests
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Smoke-test training pipeline
        run: >-
          python scripts/train_ppo.py
          --quick
          --no-eval
          --output-dir /tmp/firewater-checkpoints
          --log-dir /tmp/firewater-logs
          --tensorboard-dir /tmp/firewater-tensorboard
      - name: Smoke-test unseen-level pipeline
        run: >-
          python scripts/train_generalist.py
          --quick
          --run-name firewater-generalist-ci
          --output-dir /tmp/firewater-generalist-checkpoints
          --log-dir /tmp/firewater-generalist-logs
          --tensorboard-dir /tmp/firewater-generalist-tensorboard
      - name: Smoke-test complex temple pipeline
        run: >-
          python scripts/train_temple.py
          --quick
          --run-name firewater-temple-ci
          --output-dir /tmp/firewater-temple-checkpoints
          --log-dir /tmp/firewater-temple-logs
          --tensorboard-dir /tmp/firewater-temple-tensorboard
