name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: >-
          python -m py_compile
          firewater_env.py
          procedural_levels.py
          scripted_demos.py
          generalized_planner.py
          safety_shield.py
          generalization.py
          evaluation.py
          evaluate_agent.py
          evaluate_generalist.py
          train_ppo.py
          train_generalist.py
          rollout_trained.py
          watch_unseen.py
          temple_levels.py
          temple_env.py
          temple_expert.py
          watch_temple.py
          train_temple.py
          play_human.py
          record_demo.py
          visual_rollout.py
      - name: Run tests
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Smoke-test training pipeline
        run: >-
          python train_ppo.py
          --quick
          --no-eval
          --output-dir /tmp/firewater-checkpoints
          --log-dir /tmp/firewater-logs
          --tensorboard-dir /tmp/firewater-tensorboard
      - name: Smoke-test unseen-level pipeline
        run: >-
          python train_generalist.py
          --quick
          --run-name firewater-generalist-ci
          --save-every 0
          --output-dir /tmp/firewater-generalist-checkpoints
          --log-dir /tmp/firewater-generalist-logs
          --tensorboard-dir /tmp/firewater-generalist-tensorboard
      - name: Smoke-test complex temple pipeline
        run: >-
          python train_temple.py
          --quick
          --run-name firewater-temple-ci
          --output-dir /tmp/firewater-temple-checkpoints
          --log-dir /tmp/firewater-temple-logs
          --tensorboard-dir /tmp/firewater-temple-tensorboard
